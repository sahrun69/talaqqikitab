<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Himpunan Pengajian Kitab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f2f4f0;--panel:#fff;--ink:#1c2b2a;--mute:#6a7a77;--line:#dde3de;--acc:#0f5c4d;--gold:#b5832a;--ok:#0f5c4d;--sel:#e4efe9}
@media (prefers-color-scheme:dark){:root{--bg:#121a19;--panel:#1a2524;--ink:#e6ede9;--mute:#93a4a0;--line:#2b3a38;--acc:#4fb89f;--gold:#d9a645;--ok:#4fb89f;--sel:#223430}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:Amiri,Georgia,serif;margin:0;font-weight:700}
.mut,small{color:var(--mute)}
header{display:flex;align-items:center;gap:20px;padding:20px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:1.9rem;line-height:1.1}
header p{margin:2px 0 0;color:var(--mute);font-size:.95rem}
.ring{--p:0;width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:600}
#msg{padding:10px 24px 0;color:var(--mute);font-size:.9rem}
.wrap{max-width:760px;margin:auto;padding:18px 20px 60px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.chips,.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.chips button,.tabs button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 14px;border-radius:20px;cursor:pointer}
.chips button.on,.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.gh{font-size:1.3rem;margin:22px 0 10px;color:var(--gold)}
.item{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:14px}
.item::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.item:last-child::before{display:none}
.num{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-weight:600;color:var(--mute)}
.num.full{background:var(--ok);border-color:var(--ok);color:#fff}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card b{display:block;font-family:Amiri,serif;font-size:1.2rem}
.card span{display:block;color:var(--mute);font-size:.93rem}
.card small{display:block;margin-top:4px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.bar.big{height:10px}
.none{padding:20px;color:var(--mute);text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
#dHead{margin:14px 0}
#dHead h2{font-size:1.8rem}
#player{aspect-ratio:16/9;background:#000;border-radius:10px 10px 0 0;overflow:hidden}
#player iframe{width:100%;height:100%;border:0}
.empty{display:grid;place-items:center;height:100%;color:#9ab;text-align:center;padding:20px}
.now{padding:16px 18px}
.now h2{font-size:1.5rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--mute)}
button.btn{font:inherit;font-weight:600;border:1px solid var(--acc);background:var(--acc);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
button.btn.ghost{background:none;color:var(--acc)}
textarea{width:100%;min-height:130px;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.vid{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;padding:11px 14px;cursor:pointer}
.vid:first-child{border-top:0}
.vid:hover,.vid.on{background:var(--sel)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mute)}
.vid.done .dot{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--panel)}
.vid.part .dot{border-color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="ring" id="ring"><span id="ringTxt">0%</span></div>
  <div><h1>Himpunan Pengajian Kitab</h1><p id="sumTxt">Memuatkan senarai…</p></div>
</header>
<div id="msg"></div>

<div class="wrap" id="home">
  <input id="q" type="search" placeholder="Cari kitab…" aria-label="Cari kitab" autocomplete="off">
  <div class="chips" id="cats"></div>
  <div id="groups"></div>
</div>

<div class="wrap" id="detail" hidden>
  <button class="btn ghost" id="back">&larr; Semua kitab</button>
  <div id="dHead"></div>
  <div class="panel">
    <div id="player"></div>
    <div class="now" id="now" hidden>
      <h2 id="vTitle"></h2>
      <div class="row"><span id="vMeta"></span><button class="btn ghost" id="toggleBtn"></button></div>
      <label for="note" style="display:block;margin-top:14px;font-weight:600">Nota untuk kuliah ini</label>
      <textarea id="note" placeholder="Tulis faedah, soalan atau catatan di sini. Disimpan automatik."></textarea>
      <small id="saved"></small>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="vidList"></div>
</div>

<script>
/* ============ TETAPAN ============
   Google Sheet: Fail > Kongsi > Terbit ke web > format CSV > Terbit, kemudian tampal pautan di bawah.
   Lajur (baris pertama = pengepala; hanya kitab, tajuk dan url wajib):
   kategori | bahagian | kitab | keterangan | tajuk | url | guru
   Jika dibiarkan kosong, data contoh digunakan. */
const SHEET_CSV_URL = "";

const V = "https://www.youtube.com/watch?v=M7lc1UVf-VE";
const DEMO = `kategori,bahagian,kitab,keterangan,tajuk,url,guru
Fiqh,Solat,Pedoman Solat Berjemaah,Panduan solat berjemaah bagi imam dan makmum,Pengenalan,${V},Ustaz Contoh
Fiqh,Solat,Pedoman Solat Berjemaah,Panduan solat berjemaah bagi imam dan makmum,Bab 1: Fadhilat berjemaah,${V},Ustaz Contoh
Fiqh,Solat,Pedoman Solat Berjemaah,Panduan solat berjemaah bagi imam dan makmum,Bab 2: Syarat imam,${V},Ustaz Contoh
Fiqh,Solat,Munyatul Musolli,Kitab rujukan solat dan wuduk,Muqaddimah,${V},Ustaz Contoh
Fiqh,Solat,Munyatul Musolli,Kitab rujukan solat dan wuduk,Bab Wuduk,${V},Ustaz Contoh
Tasawuf,Hikmah,Hikam Ibn Ata'illah,Mutiara hikmah tasawuf,Pengenalan Kitab,${V},Ustaz Contoh
Tasawuf,Hikmah,Hikam Ibn Ata'illah,Mutiara hikmah tasawuf,Hikmah 1,${V},Ustaz Contoh`;

/* ============ STATE ============ */
const KEY = "pengajian_kitab_v1";
const store = JSON.parse(localStorage.getItem(KEY) || '{"w":{},"n":{},"p":{}}');
const save = () => localStorage.setItem(KEY, JSON.stringify(store));
const $ = id => document.getElementById(id);
let videos = [], kitabList = [], cat = "all", filter = "all", curK = null, curVid = null, yt = null, timer = null, apiReady = false;

/* ============ DATA ============ */
function parseCSV(t){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);rows.push(r);r=[];c=""}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()));
}
const ytId=u=>{const m=(u||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f'’‘`]/g,"").trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(){
  let text=DEMO;
  if(SHEET_CSV_URL){
    try{const r=await fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"t="+Date.now());if(!r.ok)throw 0;text=await r.text()}
    catch(e){$("msg").textContent="Gagal memuatkan Google Sheet. Semak pautan CSV. Data contoh dipaparkan."}
  } else $("msg").textContent="Mod contoh: tampal pautan CSV Google Sheet anda dalam SHEET_CSV_URL.";
  const rows=parseCSV(text), head=rows.shift().map(h=>h.trim().toLowerCase());
  const g=(r,n)=>{const i=head.indexOf(n);return i<0?"":(r[i]||"").trim()};
  const map={},seen=new Set();
  rows.forEach(r=>{
    const id=ytId(g(r,"url")),name=g(r,"kitab");if(!id||!name)return;
    const k=map[name]||(map[name]={name,kat:g(r,"kategori")||"Umum",bah:g(r,"bahagian"),desc:"",vids:[]});
    if(!k.desc)k.desc=g(r,"keterangan");
    const custom=g(r,"id");let key=custom?"id:"+custom:id+"@"+name;
    while(seen.has(key))key+="+";seen.add(key);
    const v={id,title:g(r,"tajuk")||"Kuliah "+(k.vids.length+1),guru:g(r,"guru"),kitab:name,key};
    k.vids.push(v);videos.push(v);
  });
  kitabList=Object.values(map);kitabList.forEach((k,i)=>k.idx=i);
  route();
}

/* ============ PAPARAN ============ */
const isDone=v=>!!store.w[v.key];
const pct=l=>l.length?Math.round(l.filter(isDone).length/l.length*100):0;

function renderRing(){
  const p=pct(videos),d=videos.filter(isDone).length;
  $("ring").style.setProperty("--p",p);$("ringTxt").textContent=p+"%";
  $("sumTxt").textContent=`${d} daripada ${videos.length} kuliah selesai, merentasi ${kitabList.length} kitab`;
}
function renderHome(){
  const cats=[...new Set(kitabList.map(k=>k.kat))];
  $("cats").innerHTML=["all",...cats].map(c=>`<button data-c="${esc(c)}" class="${cat===c?"on":""}">${c==="all"?"Semua":esc(c)}</button>`).join("");
  const q=norm($("q").value);
  const list=kitabList.filter(k=>(cat==="all"||k.kat===cat)&&(!q||norm(k.name+" "+k.desc).includes(q)));
  const groups={};
  list.forEach(k=>{const h=cat==="all"?k.kat+(k.bah?": "+k.bah:""):(k.bah||k.kat);(groups[h]=groups[h]||[]).push(k)});
  $("groups").innerHTML=Object.keys(groups).map(h=>`<h2 class="gh">${esc(h)}</h2><div>`+groups[h].map((k,i)=>{
    const p=pct(k.vids),full=p===100&&k.vids.length>0;
    return `<div class="item"><span class="num ${full?"full":""}">${full?"✓":i+1}</span>
    <button class="card" data-i="${k.idx}"><b>${esc(k.name)}</b>${k.desc?`<span>${esc(k.desc)}</span>`:""}
    <small>${k.vids.length} kuliah, ${p}% selesai</small><div class="bar"><i style="width:${p}%"></i></div></button></div>`
  }).join("")+`</div>`).join("")||`<div class="none">Tiada kitab dijumpai. Cuba ejaan lain atau kategori lain.</div>`;
}
function renderDetail(){
  const k=curK,p=pct(k.vids),d=k.vids.filter(isDone).length;
  $("dHead").innerHTML=`<h2>${esc(k.name)}</h2>${k.desc?`<p class="mut" style="margin:2px 0 0">${esc(k.desc)}</p>`:""}
    <div class="bar big"><i style="width:${p}%"></i></div><small>${d} daripada ${k.vids.length} kuliah selesai, ${p}%</small>`;
  $("tabs").innerHTML=[["all","Semua"],["todo","Belum ditonton"],["done","Telah ditonton"]]
    .map(([f,t])=>`<button data-f="${f}" class="${filter===f?"on":""}">${t}</button>`).join("");
  const list=k.vids.map((v,i)=>({v,i})).filter(x=>filter==="all"||(filter==="done")===isDone(x.v));
  $("vidList").innerHTML=list.length?list.map(({v,i})=>{const pos=store.p[v.key]||0;
    return `<button class="vid ${isDone(v)?"done":pos>5?"part":""} ${curVid&&curVid.key===v.key?"on":""}" data-v="${v.key}">
    <span class="dot"></span><span>${i+1}. ${esc(v.title)}<br><small>${esc(v.guru)}${store.n[v.key]?(v.guru?", ":"")+"ada nota":""}</small></span>
    <small>${isDone(v)?"Selesai":pos>5?"Separuh":""}</small></button>`}).join("")
    :`<div class="none">Tiada kuliah dalam senarai ini.</div>`;
}
function refresh(){renderRing();curK?renderDetail():renderHome()}

/* ============ NAVIGASI ============ */
function route(){
  const m=location.hash.match(/^#kitab-(\d+)$/),k=m&&kitabList[+m[1]];
  resetPlayer();
  if(k){curK=k;filter="all";$("home").hidden=true;$("detail").hidden=false}
  else{curK=null;$("home").hidden=false;$("detail").hidden=true}
  refresh();scrollTo(0,0);
}
window.onhashchange=route;
$("back").onclick=()=>{location.hash=""};
$("groups").onclick=e=>{const b=e.target.closest("[data-i]");if(b)location.hash="#kitab-"+b.dataset.i};
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;renderHome()}};
$("q").oninput=renderHome;
$("tabs").onclick=e=>{const b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;renderDetail()}};
$("vidList").onclick=e=>{const b=e.target.closest("[data-v]");if(b)play(curK.vids.find(v=>v.key===b.dataset.v))};
$("toggleBtn").onclick=()=>setDone(curVid,!isDone(curVid));
let nt;$("note").oninput=()=>{if(!curVid)return;clearTimeout(nt);nt=setTimeout(()=>{
  const t=$("note").value.trim();if(t)store.n[curVid.key]=t;else delete store.n[curVid.key];
  save();$("saved").textContent="Nota disimpan.";renderDetail()},500)};

/* ============ PEMAIN YOUTUBE ============ */
const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{apiReady=true};
function resetPlayer(){
  clearInterval(timer);
  if(yt&&yt.destroy){try{yt.destroy()}catch(e){}}
  yt=null;curVid=null;$("now").hidden=true;
  $("player").innerHTML='<div class="empty">Pilih satu kuliah untuk mula belajar.</div>';
}
function play(v){
  clearInterval(timer);curVid=v;$("now").hidden=false;
  $("vTitle").textContent=v.title;$("vMeta").textContent=v.guru||v.kitab;
  $("note").value=store.n[v.key]||"";$("saved").textContent="";updateToggle();
  if(yt&&yt.destroy){try{yt.destroy()}catch(e){}}
  $("player").innerHTML='<div id="yt"></div>';
  const start=isDone(v)?0:Math.max(0,Math.floor((store.p[v.key]||0)-3));
  const make=()=>{yt=new YT.Player("yt",{videoId:v.id,playerVars:{start,rel:0},
    events:{onStateChange:e=>{if(e.data===0)setDone(v,true)}}});timer=setInterval(track,2000)};
  const wait=()=>{if(curVid!==v)return;apiReady?make():setTimeout(wait,400)};wait();
  renderDetail();
}
function track(){
  if(!yt||!yt.getDuration||!curVid)return;
  const d=yt.getDuration(),t=yt.getCurrentTime();if(!d)return;
  if(t>(store.p[curVid.key]||0)){store.p[curVid.key]=t;save()}
  if(t/d>=0.9&&!isDone(curVid))setDone(curVid,true);
}
function setDone(v,val){if(val)store.w[v.key]=1;else delete store.w[v.key];save();updateToggle();refresh()}
function updateToggle(){if(curVid)$("toggleBtn").textContent=isDone(curVid)?"Tandakan belum ditonton":"Tandakan telah ditonton"}

load();
</script>
</body>
</html>
